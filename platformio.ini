[platformio]
src_dir = examples/usb_cdc/usb_cdc

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino

lib_ldf_mode = deep+

; Add header files and CONFIG_CLOCK_MHZ
build_flags =
    -I ${PROJECT_DIR}
    ; --- НАСТРОЙКА КВАРЦА MCP2515 ---
    -D CONFIG_CLOCK_MHZ=8

build_src_filter = +<*> +<${PROJECT_DIR}/CanHacker*.cpp> +<${PROJECT_DIR}/lib.cpp>

lib_deps =
    autowp/autowp-mcp2515 @ ^1.3.1

monitor_speed = 115200

; Old Bootloader
;upload_speed = 57600
; Optiboot
upload_speed = 115200
